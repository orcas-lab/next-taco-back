name: Test

on: [pull_request, workflow_dispatch]

env:
    CI: true
    REDIS_MODE: standalone

jobs:
    e2e-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup RabbitMQ
              uses: namoshek/rabbitmq-github-action@v1.1.0
              with:
                version: '3.8.9'
                ports: '5672:5672'
                definitions: '${{ github.workspace }}/.ci/definitions.json'
                container-name: 'mqtt'
            - uses: pnpm/action-setup@v4
              name: Install pnpm
              with:
                version: 9
                run_install: false
            - uses: actions/setup-node@v4
              with:
                cache: 'pnpm'
                node-version: 20.x
            - uses: mirromutth/mysql-action@v1.1
              with:
                mysql version: '8.0'
                mysql database: 'taco'
                mysql root password: 'root'
            - uses: chenjuneking/redis-setup-action@v1
              with:
                version: 7
                hostPort: 6379
                containerPort: 6379
            - run: pnpm i
            - run: pnpm test:e2e
    unit-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              name: Install pnpm
              with:
                version: 9
                run_install: false
            - uses: actions/setup-node@v4
              name: Setup Node.js
              with:
                cache: 'pnpm'
                node-version: 20.x
            - run: pnpm i 
            - run: node init.js
            - run: node setup.js
            - run: pnpm test
              env:
                CI: true
                REDIS_MODE: standalone

